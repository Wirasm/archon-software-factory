name: stage-host
description: |
  Delivery as three stages, stage three: one read of what the place the change is proposed
  says about it. Ready ends delivery; a finding goes back to the builder through the
  pack's bindings, and the host is read again after the fix.

inputs:
  item:
    description: The work item as text.
  land_on:
    default: ""
    description: The branch this item's change lands on. Carried for the build a return starts.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  change:
    description: Where the change is proposed, as the builder reported it.
  returned_before:
    default: ""
    description: What this stage returned the last time, when the change has been here before.
  builder_reply:
    default: ""
    description: What the builder says it did about what was returned.
  checked:
    result_of: stage-check
    description: What the last check run on this item ended with. Read from the item, for what it noticed.

# The options every ask of this stage offers. The id an operator chooses decides what starts
# next: the pack's asks-settled bindings name them.
returns:
  node: end
  outcome: outcome
  asks: asks
  summary: summary
  options:
    - id: send-back
      does: The same builder continues on the change with what you say in your answer, and the checks look at it again.
      cost: One build run and one check round.
    - id: one-more-round
      does: The same builder fixes what the host returned, and the host is read once more. If it returns the change again, you are asked again.
      cost: One build run and one host read.
    - id: replan
      does: The item goes back to planning with what you say in your answer.
      cost: The work so far may be discarded.
    - id: take-as-is
      does: The change goes on to the land gate as it is.
      cost: What the host returned stays unfixed.
    - id: drop
      does: The change is closed without merging and the item ends here. Your answer is written on the change as the reason.
      cost: The work on this change is given up; its branch stays.
    - id: reshape
      does: The change is closed without merging, its branch kept, and nothing more is built until the item is shaped again. Your answer is written on the change.
      cost: The item waits for shaping, and the next build starts a new change from what is decided then.

nodes:
  # The host read. Its id is `rounds` because the exhausted prompt, used below
  # unchanged, reads what was returned as `$rounds.output`.
  - id: rounds
    include: host
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      change: $INPUTS.change
      host_policy: $INPUTS.host_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  # Which read this is, and whether the start a return needs is used up: a return goes to
  # the builder twice on an item by itself.
  - id: limit
    depends_on: [rounds]
    runtime: bun
    script: limit
    with:
      stage: stage-host
      last: $rounds.output
      ends_as: '{}'
    output_format:
      type: object
      properties:
        round: { type: integer }
        state: { type: string, enum: [open, used_up] }
      required: [round, state]

  # The rounds this item is allowed are used up and the change is still returned. One more
  # round is not automatic: an agent reads what is left and recommends what to do, with
  # the prompt in commands/exhausted.md (a copy of the check stage's, because
  # a command resolves only from its own workflow; it reads `$rounds.output`, which is why
  # the node above has that id). The options are the stage's: the recommendation names one.
  - id: exhausted
    depends_on: [limit]
    when: "$limit.output.state == 'used_up'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [one-more-round, take-as-is, replan, drop, reshape, none]
                    description: 'What you would do, by the id of one of the options this stage declares, which the ask offers. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you. When you would split the change, recommend replan and say so.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  - id: end
    depends_on: [limit, exhausted]
    trigger_rule: all_done
    runtime: bun
    script: ending
    with:
      stage: stage-host
      last: $rounds.output
      change: $INPUTS.change
      limit: $limit.output
      exhausted: { from: $exhausted.output, if_skipped: "" }
      checked: $INPUTS.checked
      next: ""   # build stage only
      # What the builder gets when the host returns the change. The builder's prompt is the
      # build prompt, which does not say to push, and the host reads only what was pushed.
      returned: |
        The change is proposed at $INPUTS.change

        $rounds.output

        Commit on the same branch and push it to where the change is proposed, so the host looks again.
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [ready, return, waiting, ask] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the last check noticed that this change did not cause. The discoveries stage starts from it.' }
        round: { type: integer, description: 'Which run of this stage on the item this is, counted since the item was last planned.' }
        returned: { type: string, description: 'What goes back to the builder: what the host said.' }
      required: [outcome, change, summary, for_next, noticed, round, returned]

  # The report on the change says how the host round ended.
  - id: report
    include: report
    depends_on: [end]
    with:
      change: $INPUTS.change
      ending: $end.output
      host: $rounds.output
