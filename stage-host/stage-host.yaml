name: stage-host
description: |
  Delivery as three stages, stage three: one read of what the place the change is proposed
  says about it. Ready ends delivery; a finding goes back to the builder through the
  pack's bindings, and the host is read again after the fix.

inputs:
  item:
    description: The work item as text.
  land_on:
    default: ""
    description: The branch this item's change lands on. Carried for the build a return starts.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  change:
    description: Where the change is proposed, as the builder reported it.
  returned_before:
    default: ""
    description: What this stage returned the last time, when the change has been here before.
  builder_reply:
    default: ""
    description: What the builder says it did about what was returned.
  checked:
    result_of: stage-check
    description: What the last check run on this item ended with. Read from the item, for what it noticed.

returns: { node: end, outcome: outcome, asks: asks }

nodes:
  # The host read. Its id is `rounds` because deliver's exhausted prompt, used below
  # unchanged, reads what was returned as `$rounds.output`.
  - id: rounds
    include: host
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      change: $INPUTS.change
      host_policy: $INPUTS.host_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  # Which round of this stage on the item this is, and how many the item is allowed.
  - id: allowance
    depends_on: [rounds]
    runtime: bun
    script: allowance
    with:
      stage: stage-host
      last: $rounds.output
    output_format:
      type: object
      properties:
        round: { type: integer }
        allowance: { type: integer }
        state: { type: string, enum: [open, used_up] }
      required: [round, allowance, state]

  # The rounds this item is allowed are used up and the change is still returned. One more
  # round is not automatic: an agent reads what is left and recommends what to do, with
  # deliver's own prompt (commands/exhausted.md is deliver's file, copied unchanged because
  # a command resolves only from its own workflow; it reads `$rounds.output`, which is why
  # the node above has that id). The options are the script's: the recommendation names one.
  - id: exhausted
    depends_on: [allowance]
    when: "$allowance.output.state == 'used_up'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [one-more-round, take-as-is, replan, drop, reshape, none]
                    description: 'What you would do: one-more-round sends it back once more, take-as-is lets the change go on as it is, replan sends the item back to planning, drop closes the change without merging, reshape leaves it open as a draft until the item is shaped again. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you. When you would split the change, recommend replan and say so.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  - id: end
    depends_on: [allowance, exhausted]
    trigger_rule: all_done
    runtime: bun
    script: ending
    with:
      stage: stage-host
      last: $rounds.output
      change: $INPUTS.change
      allowed: $allowance.output
      exhausted: { from: $exhausted.output, if_skipped: "" }
      checked: $INPUTS.checked
      next: ""   # build stage only
      # What the builder gets when the host returns the change. The builder's prompt is the
      # build prompt, which does not say to push, and the host reads only what was pushed.
      returned: |
        The change is proposed at $INPUTS.change

        $rounds.output

        Commit on the same branch and push it to where the change is proposed, so the host looks again.
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [ready, return, waiting, ask] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the last check noticed that this change did not cause. The discoveries stage starts from it.' }
        round: { type: integer, description: 'Which run of this stage on the item this is, counted since the item was last planned.' }
        allowance: { type: integer, description: 'How many rounds of this stage the item is allowed: three, plus one for each one-more-round answer.' }
        returned: { type: string, description: 'What goes back to the builder: what the host said.' }
      required: [outcome, change, summary, for_next, noticed, round, allowance, returned]

  # The report on the change says how the host round ended, as deliver's does at its end.
  # The script is deliver's `reported` body, unchanged; the report it closes is the one the
  # last check run left.
  - id: reported
    depends_on: [end]
    runtime: bun
    script: reported
    with:
      result: $end.output
      checks: $INPUTS.checked
      host: $rounds.output
      change: $INPUTS.change
