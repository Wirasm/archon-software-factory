name: host
description: |
  Read what the place a change is proposed says about it: its checks, the reviews
  left on it, and whether it still merges. Takes the change out of draft so those run.
  Changes nothing in the change.

model: ['@host', medium]

inputs:
  item:
    description: The work item as text.
  change:
    description: Where the change is proposed, as the builder reported it. Empty when the project has nowhere to propose a change.
  returned_before:
    default: "Nothing. This is the first time the host is read for this change."
    description: What this stage returned the last time, when the change has been here before.
  builder_reply:
    default: "Nothing."
    description: What the builder says it did about what was returned.

returns: host

nodes:
  - id: host
    command: host
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [clear, return, waiting, none, ask] }
        summary: { type: string, description: 'For a maintainer who has not opened the change.' }
        head: { type: string, description: 'The commit the host was read at.' }
        findings:
          type: array
          description: 'Each thing the builder must fix. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              what: { type: string, description: 'What must change.' }
              where: { type: string }
              from: { type: string, description: 'Which check or whose review said it.' }
              evidence: { type: string, description: 'The failing output, or what you ran or read to confirm a review comment holds.' }
              evidence_kind: { type: string, enum: [ran, read] }
            required: [what, where, from, evidence, evidence_kind]
        declined:
          type: array
          description: 'Each review comment you checked and found not to hold, or to be against this project policy, with why.'
          items:
            type: object
            additionalProperties: false
            properties:
              comment: { type: string }
              from: { type: string }
              why: { type: string }
            required: [comment, from, why]
        waited: { type: string, description: 'How long you waited and for what.' }
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommend: { type: string }
              why: { type: string }
            required: [question, context, options, recommend, why]
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
        for_next: { type: string, description: 'Anything the builder who fixes this, or the maintainer who lands it, needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, head, findings, declined, waited, asks, notes, for_next]
