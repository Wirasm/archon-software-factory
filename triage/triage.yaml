name: triage
description: |
  Take one work item through triage: judge what should happen to it, and when
  it should be built, place it among the project's other open work. Two stages
  in one run, until the engine can start a stage on another stage's outcome.

inputs:
  item:
    description: >-
      The work item as text: its title, its body, and the discussion on it.
  open_items:
    default: "None listed."
    description: >-
      The project's other open items, as a short index that says where each can be read in full.

nodes:
  - id: judge
    workflow: judge
    with:
      item: $INPUTS.item

  - id: link
    workflow: link
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    with:
      item: $INPUTS.item
      judgment: $judge.output
      open_items: $INPUTS.open_items
