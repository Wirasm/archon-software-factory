name: triage
description: |
  Decide what should happen next to one work item: route it to be built, leave
  asks for a maintainer, or close it with a reason. Reads the project, changes
  nothing.

model: ['@triage', medium]

inputs:
  item:
    description: >-
      The work item as text: its title, its body, and the discussion on it.

returns: triage

nodes:
  - id: triage
    command: triage
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [route, asks, close] }
        summary: { type: string, description: 'For a maintainer who has not read the item.' }
        route:
          type: string
          enum: [investigate, plan, deliver, none]
          description: 'With outcome route: what the work needs next. Otherwise none.'
        size:
          type: string
          enum: [xs, s, m, l, xl, none]
          description: 'With outcome route: changed lines of the smallest change that meets the item. xs under 300, s under 600, m under 1000, l under 1700, xl above. Otherwise none.'
        close_reason:
          type: string
          enum: [delivered, duplicate, already_possible, out_of_scope, not_actionable, none]
          description: 'With outcome close: why nothing should be built. Otherwise none.'
        cites:
          type: array
          items: { type: string }
          description: 'What the result rests on: files, docs, commits, other items.'
        asks:
          type: array
          description: 'With outcome asks: each decision a maintainer has to make, with its context, the options and what each costs, and the one recommended. Otherwise empty.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    does: { type: string }
                    tradeoff: { type: string }
                  required: [id, does, tradeoff]
              recommend: { type: string }
              why: { type: string }
            required: [question, context, options, recommend, why]
      required: [outcome, summary, route, size, close_reason, cites, asks]
