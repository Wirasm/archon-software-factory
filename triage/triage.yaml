name: triage
description: |
  Take one work item through triage: judge what should happen to it, and when
  it should be built, place it among the project's other open work. Two stages
  in one run: they belong to the same moment for the same item. The run ends
  with the judgment's recommendation as its outcome, which a binding can start
  the next stage on.

inputs:
  item:
    description: >-
      The work item as text: its title, its body, and the discussion on it.
  open_items:
    default: "None listed."
    description: >-
      The project's other open items, as a short index that says where each can be read in full.

returns: { node: judge, outcome: recommend }

nodes:
  - id: judge
    include: judge
    with:
      item: $INPUTS.item
      triage_policy: $INPUTS.triage_policy

  - id: link
    include: link
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    with:
      item: $INPUTS.item
      judgment: $judge.output
      open_items: $INPUTS.open_items

  # Shadow measurement, 2026-11-16: may this item start without an operator? Recorded in the
  # run and read by nothing. It is not part of what triage returns and starts no stage.
  - id: admit
    command: admit
    model: ['@judge', medium]
    mutates_checkout: false
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    output_format:
      type: object
      additionalProperties: false
      properties:
        admit: { type: string, enum: [auto, ask] }
        criterion: { type: string, description: 'The line of the policy that decided it, or: all hold. When there is no policy: no policy.' }
        why: { type: string, description: 'One or two sentences.' }
        ask: { type: string, description: 'When it is an ask: the question you would put to the operator, with your recommendation. Otherwise empty.' }
        sure: { type: string, enum: [high, medium, low] }
      required: [admit, criterion, why, ask, sure]

  # Shadow measurement, 2026-11-16: would this item be split, for which reason, into what?
  # Recorded in the run and read by nothing. No split stage exists.
  - id: split
    command: split
    model: ['@judge', medium]
    mutates_checkout: false
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    output_format:
      type: object
      additionalProperties: false
      properties:
        split: { type: string, enum: [whole, split] }
        reason:
          type: string
          enum: [separate_outcomes, must_land_first, too_wide_for_one_run, none]
          description: 'The one reason that decided a split. none when it stays whole.'
        why: { type: string, description: 'One or two sentences, from the item itself.' }
        now:
          type: array
          description: 'When split: the pieces to start now, fewest that each prove something. Often one. Empty when whole.'
          items:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
              proves: { type: string, description: 'What becomes observably true when this piece lands.' }
            required: [title, proves]
        later: { type: string, description: 'When split: what comes after, and the signal the earlier work must show first. Otherwise empty.' }
        sure: { type: string, enum: [high, medium, low] }
      required: [split, reason, why, now, later, sure]
