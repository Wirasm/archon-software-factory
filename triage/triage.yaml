name: triage
description: |
  Take one work item through triage: judge what should happen to it, and when
  it should be built, place it among the project's other open work. Two stages
  in one run: they belong to the same moment for the same item. The run ends
  with the judgment's recommendation as its outcome, which a binding can start
  the next stage on.

inputs:
  item:
    description: >-
      The work item as text: its title, its body, and the discussion on it.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch. This stage passes it on.
  open_items:
    default: "None listed."
    description: >-
      The project's other open items, as a short index that says where each can be read in full.

returns: { node: judge, outcome: recommend }

nodes:
  - id: judge
    include: judge
    with:
      item: $INPUTS.item
      triage_policy: $INPUTS.triage_policy

  - id: link
    include: link
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    with:
      item: $INPUTS.item
      judgment: $judge.output
      open_items: $INPUTS.open_items

  # Shadow measurement, 2026-11-16: may this item start without an operator? Recorded in the
  # run and read by nothing. It is not part of what triage returns and starts no stage.
  # Nothing is admitted automatically: every item starts because an operator ordered it.
  # The `admitted` node below records what the judgment would have done, so the prompt
  # and the project's admit policy can be tuned against what then happened to the item.
  - id: admit
    command: admit
    model: ['@judge', medium]
    mutates_checkout: false
    depends_on: [judge]
    when: "$judge.output.recommend == 'build' || $judge.output.recommend == 'narrow'"
    output_format:
      type: object
      additionalProperties: false
      properties:
        admit: { type: string, enum: [auto, ask] }
        criterion: { type: string, description: 'The line of the policy that decided it, or: all hold. When there is no policy: no policy.' }
        why: { type: string, description: 'One or two sentences.' }
        asks:
          type: array
          description: 'When it is an ask: the one question you would put to the operator. Empty when auto.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        sure: { type: string, enum: [high, medium, low] }
      required: [admit, criterion, why, asks, sure]

  # What admit would have done, as records for `archon metrics`: one per item, latest wins.
  - id: admitted
    depends_on: [admit]
    runtime: bun
    mutates_checkout: false
    with:
      admit: $admit.output
    script: |
      import { emit, input, item } from 'archon:script';
      let said = '';
      try { said = JSON.parse(input('admit') || '{}').admit ?? ''; } catch {}
      const subject = item()?.item.key ?? null;
      const count = (name: string, value: number) => ({ name, unit: 'items', subject, kind: 'count', value });
      emit({
        would: said,
        metrics: said ? [count('sf.admit_would_start', said === 'auto' ? 1 : 0), count('sf.admit_would_ask', said === 'ask' ? 1 : 0)] : [],
      });
    output_format: { type: object }
