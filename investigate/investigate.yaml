name: investigate
description: |
  Find out why a bug happens: reproduce it, get to the root cause and prove
  it. Fixes nothing and changes nothing in the project.

model: ['@investigator', large]

inputs:
  item:
    description: The work item as text.

returns: { node: investigate, outcome: outcome }

nodes:
  - id: investigate
    command: investigate
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [caused, not_reproduced, not_a_bug, ask] }
        summary: { type: string, description: 'For a maintainer: what is wrong and why, in a few lines.' }
        reproduction: { type: string, description: 'What makes it happen: the commands or the test, and what they show. Empty when it was not reproduced.' }
        reproduced: { type: string, enum: [every_time, sometimes, never] }
        whys:
          type: array
          items: { type: string }
          description: 'The chain from the symptom to the root, one step each, in order.'
        root_cause: { type: string, description: 'The thing that could have been different, and where it is.' }
        proof: { type: string, description: 'What you ran that shows removing the cause removes the symptom. Say plainly when it is not proven.' }
        proven: { type: boolean }
        must_change: { type: string, description: 'What has to change for it to be fixed. Not a design.' }
        reaches:
          type: array
          items: { type: string }
          description: 'Other places the same cause reaches, each with where.'
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
        for_next: { type: string, description: 'Anything the engineer who fixes this needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, reproduction, reproduced, whys, root_cause, proof, proven, must_change, reaches, asks, notes, for_next]
