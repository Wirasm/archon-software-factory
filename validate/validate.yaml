name: validate
description: |
  Run the project's check on one built change, on exactly its commit, and
  report what it showed. Changes no code.

model: ['@validator', medium]

inputs:
  item:
    description: The work item as text.
  build:
    description: What build concluded, as its result. It holds the commit to check.

returns: validate

nodes:
  - id: validate
    command: validate
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [passed, failed] }
        summary: { type: string, description: 'For a maintainer deciding whether to land it.' }
        commit: { type: string, description: 'The commit the check ran on.' }
        command: { type: string, description: 'The exact command that ran.' }
        output: { type: string, description: 'The last lines of what the check printed, as printed.' }
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer, such as declaring the check. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommend: { type: string }
              why: { type: string }
            required: [question, context, options, recommend, why]
        notes: { type: string, description: 'Anything worth saying that has no field here: caveats, doubts, things noticed.' }
      required: [outcome, summary, commit, command, output, asks, notes]
