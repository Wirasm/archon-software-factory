name: stage-check
description: |
  Delivery as three stages, stage two: one round of our own checks on the proposed change,
  ending in one verdict. Approve goes on to the host round, return goes back to the
  builder, both through the pack's bindings. When the item's rounds are used up, a return
  ends in an ask instead.

inputs:
  item:
    description: The work item as text.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  change:
    default: ""
    description: Where the change is proposed, as the builder reported it.
  returned_before:
    default: ""
    description: What the checks returned the last time this change was checked. Empty in the first round.
  builder_reply:
    default: ""
    description: What the builder says it did about what was returned. Empty in the first round.
  earlier:
    result_of: stage-check
    description: What the last check run on this item ended with. Read from the item, for the report's earlier rounds.

returns: { node: end, outcome: outcome, asks: asks }

nodes:
  # The commit this change sits on, read after the builder's last commit: a builder
  # may move its branch onto newer work, and the checks must compare against that.
  - id: base
    bash: |
      onto="${INPUTS_LAND_ON:-}"
      [ -n "$onto" ] || onto=$BASE_BRANCH
      git merge-base HEAD "origin/$onto" 2>/dev/null || git merge-base HEAD "$onto"

  # Each check starts with a fresh context and is told what was returned last round and
  # what the builder says it did about it. Both arrive as this run's inputs, from the
  # result of the build run that ended before it.
  - id: review
    include: review
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      review_policy: $INPUTS.review_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: tests
    include: tests
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      test_policy: $INPUTS.test_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: product
    include: product
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      product_policy: $INPUTS.product_policy

  - id: verdict
    include: verdict
    depends_on: [review, tests, product]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      review_policy: $INPUTS.review_policy
      reports: |
        ## From the review (is the change right against the item)
        $review.output

        ## From the test check (do the tests the change adds or edits earn their place)
        $tests.output

        ## From the product review (is the change right for the product's users)
        $product.output

        ## From the builder (what it did about what was returned last round; empty in the first round)
        $INPUTS.builder_reply

  # Shows this round's verdict where the change is proposed: one report comment, replaced
  # after every round, and findings and notes on their lines. The script is deliver's
  # `shown` body, unchanged; it hands the verdict on with the report and the running
  # totals.
  - id: rounds
    depends_on: [verdict]
    runtime: bun
    script: shown
    with:
      verdict: $verdict.output
      review: $review.output
      fix: $INPUTS.builder_reply
      change: $INPUTS.change
      earlier: $INPUTS.earlier
    output_format: { type: object }

  # Which round of this stage on the item this is, and how many the item is allowed.
  - id: allowance
    depends_on: [rounds]
    runtime: bun
    script: allowance
    with:
      stage: stage-check
      last: $rounds.output
    output_format:
      type: object
      properties:
        round: { type: integer }
        allowance: { type: integer }
        state: { type: string, enum: [open, used_up] }
      required: [round, allowance, state]

  # The rounds this item is allowed are used up and the change is still returned. One more
  # round is not automatic: an agent reads what is left and recommends what to do, with
  # deliver's own prompt (commands/exhausted.md is deliver's file, copied unchanged because
  # a command resolves only from its own workflow; it reads `$rounds.output`, which is why
  # the node above has that id). The options are the script's: the recommendation names one.
  - id: exhausted
    depends_on: [allowance]
    when: "$allowance.output.state == 'used_up'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [one-more-round, take-as-is, replan, drop, reshape, none]
                    description: 'What you would do: one-more-round sends it back once more, take-as-is lets the change go on as it is, replan sends the item back to planning, drop closes the change without merging, reshape leaves it open as a draft until the item is shaped again. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you. When you would split the change, recommend replan and say so.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  - id: end
    depends_on: [allowance, exhausted]
    trigger_rule: all_done
    runtime: bun
    script: ending
    with:
      stage: stage-check
      last: $rounds.output
      change: $INPUTS.change
      allowed: $allowance.output
      exhausted: { from: $exhausted.output, if_skipped: "" }
      next: ""      # build stage only
      checked: ""   # host stage only
      # What the builder gets when this round returns the change: where it is proposed, the
      # verdict, then the three reports as written, because a merged finding can be shorter
      # than its source.
      returned: |
        The change is proposed at $INPUTS.change

        ## What the checks returned, merged from three reports

        $verdict.output

        ## From the review

        $review.output

        ## From the test check

        $tests.output

        ## From the product review

        $product.output
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [approve, return, replan, ask] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause.' }
        round: { type: integer, description: 'Which run of this stage on the item this is, counted since the item was last planned.' }
        allowance: { type: integer, description: 'How many rounds of this stage the item is allowed: three, plus one for each one-more-round answer.' }
        returned: { type: string, description: 'What goes back to the builder: the verdict and the three reports.' }
        report: { type: string, description: 'The report this round left on the proposed change.' }
      required: [outcome, change, summary, for_next, noticed, round, allowance, returned]

  # An ending that waits for an operator is written into the report, as deliver does at
  # its end. The script is deliver's `reported` body, unchanged.
  - id: reported
    depends_on: [end]
    when: "$end.output.outcome == 'ask' || $end.output.outcome == 'replan'"
    runtime: bun
    script: reported
    with:
      result: $end.output
      checks: $rounds.output
      host: ""
      change: $INPUTS.change
