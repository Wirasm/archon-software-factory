name: stage-check
description: |
  Delivery as three stages, stage two: one round of our own checks on the proposed change,
  ending in one verdict. Approve goes on to the host round, return goes back to the
  builder, both through the pack's bindings. A return goes to the builder twice on an item
  without an operator; the third ends in an ask instead.

inputs:
  item:
    description: The work item as text.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  change:
    default: ""
    description: Where the change is proposed, as the builder reported it.
  returned_before:
    default: ""
    description: What the checks returned the last time this change was checked. Empty in the first round.
  builder_reply:
    default: ""
    description: What the builder says it did about what was returned. Empty in the first round.

# The options every ask of this stage offers. The id an operator chooses decides what starts
# next: the pack's asks-settled bindings name them.
returns:
  node: end
  outcome: outcome
  asks: asks
  summary: summary
  options:
    - id: send-back
      does: The same builder continues on the change with what you say in your answer, and the checks look at it again.
      cost: One build run and one check round.
    - id: one-more-round
      does: The same builder fixes what the checks returned, and the checks look at it once more. If they return it again, you are asked again.
      cost: One build run and one check round.
    - id: replan
      does: The item goes back to planning with what you say in your answer.
      cost: The work so far may be discarded.
    - id: take-as-is
      does: The change goes on to the host round as it is.
      cost: What the checks returned stays unfixed.
    - id: drop
      does: The change is closed without merging and the item ends here. Your answer is written on the change as the reason.
      cost: The work on this change is given up; its branch stays.
    - id: reshape
      does: The change stays open as a draft and nothing more is built until the item is shaped again. Your answer is written on the change.
      cost: The item waits for shaping, and the draft can stop merging while it does.

nodes:
  # The commit this change sits on, read after the builder's last commit: a builder
  # may move its branch onto newer work, and the checks must compare against that.
  - id: base
    bash: |
      onto="${INPUTS_LAND_ON:-}"
      [ -n "$onto" ] || onto=$BASE_BRANCH
      git merge-base HEAD "origin/$onto" 2>/dev/null || git merge-base HEAD "$onto"

  # Each check starts with a fresh context and is told what was returned last round and
  # what the builder says it did about it. Both arrive as this run's inputs, from the
  # result of the build run that ended before it.
  - id: review
    include: review
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      review_policy: $INPUTS.review_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: tests
    include: tests
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      test_policy: $INPUTS.test_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: product
    include: product
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      product_policy: $INPUTS.product_policy

  - id: verdict
    include: verdict
    depends_on: [review, tests, product]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      review_policy: $INPUTS.review_policy
      reports: |
        ## From the review (is the change right against the item)
        $review.output

        ## From the test check (do the tests the change adds or edits earn their place)
        $tests.output

        ## From the product review (is the change right for the product's users)
        $product.output

        ## From the builder (what it did about what was returned last round; empty in the first round)
        $INPUTS.builder_reply

  # Which round this is, and whether the start this round's outcome needs is used up: a
  # return goes to the builder twice on an item by itself, a replan to planning once.
  - id: limit
    depends_on: [verdict]
    runtime: bun
    script: limit
    with:
      stage: stage-check
      last: $verdict.output
      limits: '{"return":"stage-build-after-check","replan":"replan-after-check"}'
    output_format:
      type: object
      properties:
        round: { type: integer }
        state: { type: string, enum: [open, used_up] }
      required: [round, state]

  # The rounds this item is allowed are used up and the change is still returned. One more
  # round is not automatic: an agent reads what is left and recommends what to do, with
  # the prompt in commands/exhausted.md. The options are the stage's: the recommendation names one.
  - id: exhausted
    depends_on: [limit]
    when: "$limit.output.state == 'used_up' && $verdict.output.outcome == 'return'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [one-more-round, take-as-is, replan, drop, reshape, none]
                    description: 'What you would do, by the id of one of the options this stage declares, which the ask offers. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you. When you would split the change, recommend replan and say so.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  - id: end
    depends_on: [limit, exhausted]
    trigger_rule: all_done
    runtime: bun
    script: ending
    with:
      stage: stage-check
      last: $verdict.output
      change: $INPUTS.change
      limit: $limit.output
      exhausted: { from: $exhausted.output, if_skipped: "" }
      next: ""      # build stage only
      checked: ""   # host stage only
      # What the builder gets when this round returns the change: where it is proposed, the
      # verdict, then the three reports as written, because a merged finding can be shorter
      # than its source.
      returned: |
        The change is proposed at $INPUTS.change

        ## What the checks returned, merged from three reports

        $verdict.output

        ## From the review

        $review.output

        ## From the test check

        $tests.output

        ## From the product review

        $product.output
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [approve, return, replan, ask] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause.' }
        round: { type: integer, description: 'Which run of this stage on the item this is, counted since the item was last planned.' }
        returned: { type: string, description: 'What goes back to the builder: the verdict and the three reports.' }
      required: [outcome, change, summary, for_next, noticed, round, returned]

  # The report on the proposed change, written after the stage has ended so it can say how:
  # one comment replaced each round, and this round's findings on their lines.
  - id: report
    include: report
    depends_on: [end]
    with:
      change: $INPUTS.change
      verdict: $verdict.output
      item_lines: $review.output.item_lines
      builder_reply: $INPUTS.builder_reply
      ending: $end.output
