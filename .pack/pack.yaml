# The factory's settings. A project sets them in
# `.archon/packs/Wirasm.archon-software-factory.yaml`, under `settings:`.
inputs:
  triage_policy:
    default: ""
    description: >-
      Path to the project's own triage policy, a document that says what its
      maintainers judge work items against. Relative to the project, or absolute.
      Empty means the project has none and the pack's default applies alone.
  plan_policy:
    default: ""
    description: >-
      Path to the project's own plan policy, a document that says what its
      maintainers hold a design to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  split_policy:
    default: ""
    description: >-
      Path to the project's own split policy, a document that says when its
      maintainers build an item as several changes, and how a PRD, an epic and a
      bundle of tasks are cut. Relative to the project, or absolute. Empty means
      the project has none and the pack's default applies alone.
  build_policy:
    default: ""
    description: >-
      Path to the project's own build policy, a document that says what its
      maintainers hold the code of a change to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  review_policy:
    default: ""
    description: >-
      Path to the project's own review policy, a document that says what its
      maintainers hold a change to before it lands. Relative to the project, or
      absolute. Empty means the project has none and the pack's default applies alone.
  test_policy:
    default: ""
    description: >-
      Path to the project's own test policy, a document that says what its
      maintainers hold tests to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  host_policy:
    default: ""
    description: >-
      Path to the project's own host policy, a document that says which checks a
      proposed change needs that the host does not start on its own, and how to
      start them. Relative to the project, or absolute. Empty means the project has none.
  admit_policy:
    default: ""
    description: >-
      Path to the project's own admit policy, a document that says which items
      may start without an operator being asked. Relative to the project, or
      absolute. Empty means the project has none. Shadow only for now: the
      judgment is recorded and nothing acts on it.
  land_policy:
    default: ""
    description: >-
      Path to the project's own land policy, a document that says which ready
      changes may land without an operator being asked. Relative to the
      project, or absolute. Empty means the project has none: the land gate
      then asks an operator every time.
  discoveries_policy:
    default: ""
    description: >-
      Path to the project's own discoveries policy, a document that says what
      its maintainers want filed from what agents notice. Relative to the
      project, or absolute. Empty means the pack's default applies alone.
  checks_file:
    default: ""
    description: >-
      Path to a YAML file that lists the project's checks: under `checks:`, one entry
      a check with a `name` and the command to `run` from the project's root. A script
      runs each to its end on a change's commit. Relative to the project, or absolute.
      Empty means none are declared. Shadow only for now: the results are recorded
      and nothing acts on them.
  validate_command:
    default: ""
    description: >-
      The command that proves a change works in this project, run from the
      project's root, for example `cargo test && cargo clippy -- -D warnings`.
      Empty means none is declared yet: the validate and land stages find the
      check the maintainers use and propose it as an ask.
  propose_policy:
    default: ""
    description: >-
      Path to the project's own propose policy, a document that says how its
      maintainers want a change presented. Relative to the project, or
      absolute. Empty means the pack's default applies alone.
  product_policy:
    default: ""
    description: >-
      Path to the project's own product policy, a document that says what the
      project is for, who uses it and how it wants to feel to them, or points
      at the product and design documents that do. Relative to the project,
      or absolute. Empty means the pack's default applies alone.

# The starts the factory recommends between its stages. A declaration starts nothing:
# `archon pack bindings` writes one trigger file per binding and outcome for a repository,
# and `archon trigger add` registers each. The project's policies reach the stages through
# the settings above, so no binding names one.
#
# A stage that ended with asks starts again when they are answered, with the answers as
# decisions already made. Delivery continues in the checkout it left.
#
# `answers: { item: answers }` gives a stage every answer on its item, from every stage
# that left asks there, oldest first, so a later stage holds to what was decided earlier.
bindings:
  # A work order from an operator: `archon trigger fire --config <this file> --inputs order.json`,
  # where order.json holds `key` (the item's key), and `source`, `text`, `land_on`, `part_of`,
  # `depends_on`; or, for an order of several items, `key`, `land_on` and `items`.
  order:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    item: { field: key }
  # A label is a work order too: adding the label `factory` to an issue orders that issue,
  # on its item `issue-<number>`. Add the generated binding to the GitHub source plugin's
  # bindings; the source receives the label by webhook or, with `observe`, reads it.
  order-on-label:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    event:
      kind: label.changed
      actions: [added]
      predicates: [{ field: label.name, equals: factory }]
    item: { field: subject.number, prefix: issue- }
    inputs:
      issue: { event: subject.number }
      repo_host: { repo: host }
      repo_path: { repo: path }
  triage-after-order:
    workflow: triage
    resource: triage
    capacity: 3
    overlap: queue
    run_ended:
      workflow: order
      outcome: ready
    inputs:
      item: { result: /item }
      land_on: { result: /land_on }
      members: { result: /members }
      depends_on: { result: /depends_on }
  # An order of several items: the order's own item is the work order, each member is
  # recorded as part of it, and the order stage starts on each member with its own order.
  order-after-work-order:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: order
      outcome: work_order
      linked: { kind: part_of, holder: from, items: /start }
    inputs:
      members: { result: /start }
      land_on: { result: /land_on }
      part_of: { item: key }
  # An item that should be built goes to the link stage, which decides whether it can be
  # built now. It reads the item, the judgment and its own last result from the item's
  # earlier runs, so every start of it is the same. `place` starts plan.
  link-after-triage:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: [build, narrow]
  plan-after-link:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    run_ended:
      workflow: link
      outcome: place
    inputs:
      item: { result: /item }
      land_on: { result: /land_on }
      links: { result: /links }
  # An ask the link stage left, answered or withdrawn, starts it again with every answer
  # on the item.
  link-after-answers:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: link
      settled: any
    inputs:
      answers: { item: answers }
  # Waiting. An item that waits holds a `depends_on` link to what it waits on, which the
  # link stage recorded. When that item ends, the link stage starts again on every item
  # that depends on it, and decides: it landed, so the item goes on; it ended without
  # landing, so the item gets an ask. One binding for each stage an item can end in.
  link-after-blocker-landed:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-closed:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: close
      outcome: [dropped, reshape, not_closed]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-judged:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: [shape, recipe, native, fold, park, deprecate, decline, close]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-split:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: [split, waiting]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-plan-stopped:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: plan
      outcome: stop
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-dropped:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: link
      outcome: dropped
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  # Triage judged `split`: all of the item is worth building, but not as one change. The
  # split stage decides how. Whole: plan starts on the item as it is. Split: each member
  # that starts now is recorded as part of the item, and the order stage starts on each
  # member this split started, once, and from there a member goes through triage like
  # any other item. Waiting: nothing starts.
  # An answer on an ask the split left starts the split again.
  split-after-triage:
    workflow: split
    resource: split
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: split
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      judgment: { result: "" }
      answers: { item: answers }
  plan-after-split:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: whole
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  order-after-split:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: split
      linked: { kind: part_of, holder: from, items: /start }
    inputs:
      members: { result: /start }
      land_on: { result: /land_on }
      part_of: { item: key }
  split-after-answers:
    workflow: split
    resource: split
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: split
      settled: answered
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # After a change landed: when the landed stage finds the change broke its branch and
  # writes a work order, the order starts as new work on the landed check's own item.
  # An empty work order (roll back, ask) is refused by the order stage and starts nothing.
  order-after-landed:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: landed
      outcome: broken_here
    inputs:
      text: { result: /work_order }
      land_on: { input: land_on }
  plan-after-answers:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: plan
      settled: answered
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      links: { input: links }
      answers: { item: answers }
  # Delivery as three stages: build, check and host are each a run of their own on the item,
  # so an answer starts the stage it belongs to and nothing already done runs again.
  # Every stage after the first build works in the checkout the run before it left.
  stage-build-after-plan:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: plan
      outcome: planned
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      plan: { result: "" }
      answers: { item: answers }
  stage-check-after-build:
    workflow: stage-check
    resource: stage-check
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-build
      outcome: built
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      returned_before: { result: /returned }
      builder_reply: { result: /reply }
  # A check that returns the change starts the builder with what it returned. A check run
  # that would return it with the item's rounds used up ends as `ask` and starts nothing.
  stage-build-after-check:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-check
      outcome: return
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
  stage-host-after-check:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-check
      outcome: approve
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
  # What the host returns goes to the builder and then straight back to the host, because
  # our own checks approved the change and do not run again for a host fix.
  stage-build-after-host:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-host
      outcome: return
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
      next: host
  stage-host-after-fix:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-build
      outcome: built_for_host
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      returned_before: { result: /returned }
      builder_reply: { result: /reply }
  # Landing. Host ready starts the land gate, in the checkout the host round left, so a
  # change that goes back from landing reaches its builder on its own branch. The gate
  # ends `land` when the project's land policy lets the change land by itself, and `ask`
  # otherwise. Its ask and the land stage's offer one fixed set of options: `land` starts
  # the land stage, `send-back` the builder with the answer, then the checks; `drop` and
  # `reshape` the close step (see Asks below).
  landgate-after-stage-host:
    workflow: landgate
    resource: landgate
    capacity: 3
    overlap: queue
    run_ended:
      workflow: stage-host
      outcome: ready
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      delivered: { result: "" }
  # One landing at a time: the second change is read against a branch that has the first.
  land-after-landgate:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    run_ended:
      workflow: landgate
      outcome: land
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  land-after-landgate-answers:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: land
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  stage-build-after-landgate-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: send-back
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  # A change that no longer merges, or whose checks are red at land time, goes to the
  # builder and then to the host round, as a host return does, and from host ready to the
  # gate again.
  stage-build-after-land:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: land
      outcome: returned
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
      next: host
  # A land run that ends `stop` or `ask` leaves an ask with the same three options.
  land-after-land-answers:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: land
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  stage-build-after-land-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: send-back
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  # After the merge: the landed stage reads whether the branch is still sound
  # (`order-after-landed` above starts a fix when it is not), and the discoveries drain
  # starts with what the checks noticed, which the gate and the land stage carried in
  # their results. It drains here and not at host ready, so nothing is filed for a change
  # that never merges.
  landed-after-land:
    workflow: landed
    resource: landed
    capacity: 3
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
  discoveries-after-land:
    workflow: discoveries
    resource: discoveries
    capacity: 2
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
    inputs:
      discoveries: { result: /noticed }
  # Asks. Every ask a stage leaves offers the same options, and the one chosen decides what
  # starts: `send-back` the builder with the answer, then the checks; `one-more-round`
  # (offered when the item's rounds are used up) the builder with what was returned, which
  # also raises the item's allowance by one; `replan` planning; `take-as-is` the host round;
  # `drop` and `reshape` the close step, which closes the change without merging or leaves
  # it open as a draft, with the operator's answer written on it. On a host ask
  # `take-as-is` starts nothing: an operator lands it.
  # (The land gate's and the land stage's asks have their own set; see Landing above.)
  stage-build-after-build-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: send-back
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      next: { input: next }
      returned: { result: /returned }
      answers: { item: answers }
  stage-host-after-build-as-is:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: take-as-is
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
      answers: { item: answers }
  plan-after-stage-build-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  stage-build-after-check-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: [send-back, one-more-round]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  stage-host-after-check-as-is:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: take-as-is
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
      answers: { item: answers }
  plan-after-stage-check-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # After a host ask, an operator's `send-back` may change anything, so the checks look at
  # it again; `one-more-round` is one more host fix and goes straight back to the host.
  stage-build-after-host-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: send-back
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  stage-build-after-host-one-more:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: one-more-round
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
      next: host
  plan-after-stage-host-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # An operator's `drop` or `reshape` on any stage's ask starts the close step on the item.
  close-after-build-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-check-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-host-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-landgate-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-land-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
