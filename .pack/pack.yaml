# The factory's settings. A project sets them in
# `.archon/packs/dynamous-community.archon-software-factory.yaml`, under `settings:`.
inputs:
  triage_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own triage policy, a document that says what its
      maintainers judge work items against. Relative to the project, or absolute.
      Empty means the project has none and the pack's default applies alone.
  plan_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own plan policy, a document that says what its
      maintainers hold a design to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  split_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own split policy, a document that says when its
      maintainers build an item as several changes, and how a PRD, an epic and a
      bundle of tasks are cut. Relative to the project, or absolute. Empty means
      the project has none and the pack's default applies alone.
  build_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own build policy, a document that says what its
      maintainers hold the code of a change to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  review_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own review policy, a document that says what its
      maintainers hold a change to before it lands. Relative to the project, or
      absolute. Empty means the project has none and the pack's default applies alone.
  test_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own test policy, a document that says what its
      maintainers hold tests to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  host_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own host policy, a document that says which checks a
      proposed change needs that the host does not start on its own, and how to
      start them. Relative to the project, or absolute. Empty means the project has none.
  admit_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own admit policy, a document that says which items
      may start without an operator being asked. Relative to the project, or
      absolute. Empty means the project has none. Shadow only for now: the
      judgment is recorded and nothing acts on it.
  land_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own land policy, a document that says which ready
      changes may land without an operator being asked. Relative to the
      project, or absolute. Empty means the project has none: the land gate
      then asks an operator every time.
  land_gate:
    type: enum
    values: [shadow, policy]
    default: shadow
    description: >-
      Whether the land gate acts on the land policy. `shadow`: the gate asks an
      operator every time, and its ask, its result and the metric
      `sf.landgate_would_land` say what the policy would have done. `policy`: a
      change the policy lets land starts the land stage with no ask.
  discoveries_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own discoveries policy, a document that says what
      its maintainers want filed from what agents notice. Relative to the
      project, or absolute. Empty means the pack's default applies alone.
  validate_command:
    default: ""
    description: >-
      The command that proves a change works in this project, run from the
      project's root, for example `cargo test && cargo clippy -- -D warnings`.
      The land stage runs it when the project has no host. Empty means none is
      declared: the land stage then uses the check the maintainers use and says which.
  attend_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own attend policy, a document that says what an agent
      may do with an ask: which asks are always the operator's, beyond the pack's
      list, which kinds an agent may answer alone, and the rulings already made.
      Relative to the project, or absolute. Empty means the pack's list applies
      alone. The attend stage only advises for now: nothing acts on its answers.
  product_policy:
    section: Policies
    file: true
    default: ""
    description: >-
      Path to the project's own product policy, a document that says what the
      project is for, who uses it and how it wants to feel to them, or points
      at the product and design documents that do. Relative to the project,
      or absolute. Empty means the pack's default applies alone.

# The starts the factory recommends between its stages. A declaration starts nothing:
# `archon pack bindings` writes one trigger file per binding and outcome for a repository,
# and `archon trigger add` registers each. The project's policies reach the stages through
# the settings above, so no binding names one.
#
# A stage that ended with asks starts again when they are answered, with the answers as
# decisions already made. Delivery continues in the checkout it left.
#
# `answers: { item: answers }` gives a stage every answer on its item, from every stage
# that left asks there, oldest first, so a later stage holds to what was decided earlier.
bindings:
  # A work order from an operator: `archon trigger fire --config <this file> --inputs order.json`
  # (or `--input key=... --input source=...` for one item with no file),
  # where order.json holds `key` (the item's key), and `source`, `text`, `land_on`, `part_of`,
  # `depends_on`; or, for an order of several items, `key`, `land_on` and `items`.
  order:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    item: { field: key }
  # A label is a work order too: adding the label `factory` to an issue orders that issue,
  # on its item `issue-<number>`. Add the generated binding to the GitHub source plugin's
  # bindings; the source receives the label by webhook or, with `observe`, reads it.
  order-on-label:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    event:
      kind: label.changed
      actions: [added]
      predicates: [{ field: label.name, equals: factory }, { field: subject.kind, equals: issue }]
    item: { field: subject.number, prefix: issue- }
    inputs:
      issue: { event: subject.number }
      repo_host: { repo: host }
      repo_path: { repo: path }
  # A label on a pull request asks for a review of it: adding the label `factory-review` to
  # a pull request someone else proposed starts the inspect stage on the item `pr-<number>`,
  # which posts its report there and changes nothing. Same setup as the label above.
  inspect-on-label:
    workflow: inspect
    resource: inspect
    capacity: 2
    overlap: queue
    event:
      kind: label.changed
      actions: [added]
      predicates: [{ field: label.name, equals: factory-review }, { field: subject.kind, equals: pr }]
    item: { field: subject.number, prefix: pr- }
    inputs:
      number: { event: subject.number }
      repo_host: { repo: host }
      repo_path: { repo: path }
  # Shadow, since 2026-11-26: every newly opened issue is judged once by the survey stage,
  # on the item `survey-<number>`, which records triage's judgment and whether the admit
  # judgment would have started it with no operator. It starts nothing and writes nothing
  # on the issue. The measure is against what the maintainers then did with the issue:
  # ordered it, closed it, or left it. Add it to the same `bindings` array as the labels.
  survey-on-opened:
    workflow: survey
    resource: survey
    capacity: 2
    overlap: queue
    event:
      kind: issue.lifecycle
      actions: [opened]
    item: { field: subject.number, prefix: survey- }
    inputs:
      issue: { event: subject.number }
      repo_host: { repo: host }
      repo_path: { repo: path }
  triage-after-order:
    workflow: triage
    resource: triage
    capacity: 3
    overlap: queue
    run_ended:
      workflow: order
      outcome: ready
    inputs:
      item: { result: /item }
      land_on: { result: /land_on }
      members: { result: /members }
      depends_on: { result: /depends_on }
  # An order of several items: the order's own item is the work order, each member is
  # recorded as part of it, and the order stage starts on each member with its own order.
  order-after-work-order:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: order
      outcome: work_order
      linked: { kind: part_of, holder: from, items: /start }
    inputs:
      members: { result: /start }
      land_on: { result: /land_on }
      part_of: { item: key }
  # An item that should be built goes to the link stage, which decides whether it can be
  # built now. It reads the item, the judgment and its own last result from the item's
  # earlier runs, so every start of it is the same. `place` starts plan.
  link-after-triage:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: [build, narrow]
  plan-after-link:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    run_ended:
      workflow: link
      outcome: place
    inputs:
      item: { result: /item }
      land_on: { result: /land_on }
      links: { result: /links }
  # An ask the link stage left, answered or withdrawn, starts it again with every answer
  # on the item.
  link-after-answers:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: link
      settled: any
    inputs:
      answers: { item: answers }
  # Waiting. An item that waits holds a `depends_on` link to what it waits on, which the
  # link stage recorded. When that item ends, the link stage starts again on every item
  # that depends on it, and decides: it landed, so the item goes on; it ended without
  # landing, so the item gets an ask. One binding for each stage an item can end in.
  link-after-blocker-landed:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-closed:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: close
      outcome: [dropped, reshape, not_closed]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-judged:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: [shape, recipe, native, fold, park, deprecate, decline, close]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-split:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: [split, waiting]
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-plan-stopped:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: plan
      outcome: stop
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  link-after-blocker-dropped:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    run_ended:
      workflow: link
      outcome: dropped
      linked: { kind: depends_on, holder: from }
    inputs:
      ended: { item: key }
  # Triage judged `split`: all of the item is worth building, but not as one change. The
  # split stage decides how. Whole: plan starts on the item as it is. Split: each member
  # that starts now is recorded as part of the item, and the order stage starts on each
  # member this split started, once, and from there a member goes through triage like
  # any other item. Waiting: nothing starts.
  # An answer on an ask the split left starts the split again.
  # A triage judgment that does not build leaves an ask (see triage.yaml). Its answer
  # starts what the operator chose.
  link-after-triage-answers:
    workflow: link
    resource: link
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: triage
      settled: answered
      option: build
    inputs:
      answers: { item: answers }
  split-after-triage-answers:
    workflow: split
    resource: split
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: triage
      settled: answered
      option: split
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      judgment: { result: "" }
      answers: { item: answers }
  # An answer in the operator's own words is a ruling on the item: triage judges it again
  # with that answer, and what it then judges starts what follows.
  triage-after-triage-answers:
    workflow: triage
    resource: triage
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: triage
      settled: answered
      option: other
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      members: { input: members }
      depends_on: { input: depends_on }
      answers: { item: answers }
  close-after-triage-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: triage
      settled: answered
      option: [drop, reshape]
    inputs:
      answers: { answers: true }
  split-after-triage:
    workflow: split
    resource: split
    capacity: 3
    overlap: queue
    run_ended:
      workflow: triage
      outcome: split
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      judgment: { result: "" }
      answers: { item: answers }
  plan-after-split:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: whole
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  order-after-split:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: split
      outcome: split
      linked: { kind: part_of, holder: from, items: /start }
    inputs:
      members: { result: /start }
      land_on: { result: /land_on }
      part_of: { item: key }
  split-after-answers:
    workflow: split
    resource: split
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: split
      settled: answered
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # After a change landed: when the landed stage finds the change broke its branch and
  # writes a work order, the order starts as new work on the landed check's own item.
  # An empty work order (roll back, ask) is refused by the order stage and starts nothing.
  order-after-landed:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    run_ended:
      workflow: landed
      outcome: broken_here
    inputs:
      text: { result: /work_order }
      land_on: { input: land_on }
  # An ask the check after a merge left (see landed.yaml): `fix` orders the fix.
  order-after-landed-answers:
    workflow: order
    resource: order
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: landed
      settled: answered
      option: fix
    inputs:
      text: { result: /work_order }
      land_on: { input: land_on }
  plan-after-answers:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: plan
      settled: answered
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      links: { input: links }
      answers: { item: answers }
  # Delivery as three stages: build, check and host are each a run of their own on the item,
  # so an answer starts the stage it belongs to and nothing already done runs again.
  # Every stage after the first build works in the checkout the run before it left.
  stage-build-after-plan:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: plan
      outcome: planned
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      plan: { result: "" }
      answers: { item: answers }
  stage-check-after-build:
    workflow: stage-check
    resource: stage-check
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-build
      outcome: built
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      returned_before: { result: /returned }
      builder_reply: { result: /reply }
  # A check that returns the change starts the builder with what it returned, twice on an
  # item since it was last planned: the engine counts the starts and refuses a third. The
  # check stage reads that count, and a round that would return the change with none left
  # ends as `ask` instead, so nothing is refused and an operator decides.
  stage-build-after-check:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    limit: { starts: 2, reset_on: plan }
    run_ended:
      workflow: stage-check
      outcome: return
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
  stage-host-after-check:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-check
      outcome: approve
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
  # What the host returns goes to the builder and then straight back to the host, because
  # our own checks approved the change and do not run again for a host fix. Twice on an
  # item since it was last planned, as for a check return; the host stage asks after that.
  stage-build-after-host:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    limit: { starts: 2, reset_on: plan }
    run_ended:
      workflow: stage-host
      outcome: return
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
      next: host
  stage-host-after-fix:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-build
      outcome: built_for_host
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      returned_before: { result: /returned }
      builder_reply: { result: /reply }
  # A builder that cannot build the plan (`stop`) and a check round whose reports say
  # replan send the item back to planning with what they ended with, once on an item each.
  # After that the stage ends as `ask`, and `replan` is one of the options.
  replan-after-build:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    limit: { starts: 1 }
    run_ended:
      workflow: stage-build
      outcome: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      sent_back: { result: "" }
  replan-after-check:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    limit: { starts: 1 }
    run_ended:
      workflow: stage-check
      outcome: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      sent_back: { result: "" }
  # Landing. Host ready starts the land gate, in the checkout the host round left, so a
  # change that goes back from landing reaches its builder on its own branch. With the
  # setting `land_gate: shadow`, the default, the gate ends `ask` every time and says what
  # the project's land policy would have done; with `land_gate: policy` it ends `land`
  # when the policy lets the change land by itself. Its ask and the land stage's offer the
  # options their workflows declare: `land` starts the land stage, `send-back` the builder
  # with the answer, then the checks; `drop` and `reshape` the close step (see Asks below).
  landgate-after-stage-host:
    workflow: landgate
    resource: landgate
    capacity: 3
    overlap: queue
    run_ended:
      workflow: stage-host
      outcome: ready
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      delivered: { result: "" }
  # One landing at a time: the second change is read against a branch that has the first.
  land-after-landgate:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    run_ended:
      workflow: landgate
      outcome: land
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  land-after-landgate-answers:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: land
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  # `other` (the operator's own words) goes to the builder like a send-back: the builder
  # reads the answer and carries it out. Without this, an `other` answer starts nothing.
  stage-build-after-landgate-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: [send-back, other]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  # A change that no longer merges, or whose checks are red at land time, goes to the
  # builder and then to the host round, as a host return does, and from host ready to the
  # gate again.
  stage-build-after-land:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: land
      outcome: returned
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
      next: host
  # The short way back. A change the land stage found behind its landing
  # branch, with nothing else wrong, goes to its builder to be brought up to date, and then
  # to the catch-up stage. When the lines the change adds and removes are the ones that
  # were approved and the host's checks are green, it goes straight to the land stage: no
  # host round and no second gate for a change nobody changed. Anything else goes the long
  # way, through the host round and the gate.
  stage-build-after-land-behind:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    run_ended:
      workflow: land
      outcome: behind
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      returned: { result: /returned }
      next: land
  catchup-after-build:
    workflow: catchup
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: stage-build
      outcome: built_for_land
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
  land-after-catchup:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    run_ended:
      workflow: catchup
      outcome: ready
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  stage-host-after-catchup:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    run_ended:
      workflow: catchup
      outcome: changed
      checkout: ended-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      returned_before: { result: /returned }
      builder_reply: { result: /reply }
  # A land run that ends `stop` or `ask` leaves an ask with the same three options.
  land-after-land-answers:
    workflow: land
    resource: land
    capacity: 1
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: land
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      noticed: { result: /noticed }
  stage-build-after-land-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: [send-back, other]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  # After the merge: the landed stage reads whether the branch is still sound
  # (`order-after-landed` above starts a fix when it is not), and the discoveries drain
  # starts with what the checks noticed, which the gate and the land stage carried in
  # their results. It drains here and not at host ready, so nothing is filed for a change
  # that never merges.
  landed-after-land:
    workflow: landed
    resource: landed
    capacity: 3
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
  discoveries-after-land:
    workflow: discoveries
    resource: discoveries
    capacity: 2
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
    inputs:
      discoveries: { result: /noticed }
  # A work order whose members are all done. The order-done stage starts on every item a
  # member is part of, each time a member ends in a way that can finish it: its change
  # landed, the close step dropped it, or it was dropped while it waited. The engine does
  # not count the members: the stage reads the work order's state from its item, does
  # nothing while a member is open, and reports once when none is. It observes the item,
  # so a run that finds a member open shows nowhere. A member ended by hand
  # (`archon workflow end`) starts nothing: start the stage on the order's item then.
  order-done-after-member-landed:
    workflow: order-done
    resource: order-done
    capacity: 2
    overlap: queue
    run_ended:
      workflow: land
      outcome: landed
      linked: { kind: part_of, holder: to }
    inputs:
      member: { item: key }
  order-done-after-member-closed:
    workflow: order-done
    resource: order-done
    capacity: 2
    overlap: queue
    run_ended:
      workflow: close
      outcome: dropped
      linked: { kind: part_of, holder: to }
    inputs:
      member: { item: key }
  order-done-after-member-dropped:
    workflow: order-done
    resource: order-done
    capacity: 2
    overlap: queue
    run_ended:
      workflow: link
      outcome: dropped
      linked: { kind: part_of, holder: to }
    inputs:
      member: { item: key }
  # A member that was itself cut into members is done when its own report is written, and
  # that is what tells the order it is part of.
  order-done-after-member-reported:
    workflow: order-done
    resource: order-done
    capacity: 2
    overlap: queue
    run_ended:
      workflow: order-done
      outcome: reported
      linked: { kind: part_of, holder: to }
    inputs:
      member: { item: key }
  # Members that landed together on a branch of their own: the stage proposed that branch
  # against the project's base branch, and the change goes to the land gate like any ready
  # change, with the base branch as the branch it lands on. From there the gate's and the
  # land stage's own bindings apply, on the work order's item.
  landgate-after-order-done:
    workflow: landgate
    resource: landgate
    capacity: 3
    overlap: queue
    run_ended:
      workflow: order-done
      outcome: proposed
    inputs:
      item: { result: /report }
      land_on: { result: /land_on }
      answers: { item: answers }
      change: { result: /change }
      delivered: { result: "" }
  # Asks. Every ask a delivery stage leaves offers the options its workflow declares
  # (`returns.options`), and the one chosen decides what starts: `send-back` the builder
  # with the answer, then the checks; `one-more-round` (check and host asks) the builder
  # with what was returned, then one more check round or host read; `replan` planning;
  # `take-as-is` the next stage with the change as it is, which is the host round after a
  # build or check ask and the land gate after a host ask; `drop` and `reshape` the close
  # step, which closes the change without merging or leaves it open as a draft, with the
  # operator's answer written on it. A start an operator's answer causes counts under no
  # limit, so it is never refused.
  # (The land gate's and the land stage's asks have their own set; see Landing above.)
  stage-build-after-build-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: [send-back, other]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      next: { input: next }
      returned: { result: /returned }
      answers: { item: answers }
  stage-host-after-build-as-is:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: take-as-is
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
      answers: { item: answers }
  plan-after-stage-build-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  stage-build-after-check-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: [send-back, one-more-round, other]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  stage-host-after-check-as-is:
    workflow: stage-host
    resource: stage-host
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: take-as-is
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      change: { result: /change }
      answers: { item: answers }
  plan-after-stage-check-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # After a host ask, an operator's `send-back` may change anything, so the checks look at
  # it again; `one-more-round` is one more host fix and goes straight back to the host.
  stage-build-after-host-answers:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: [send-back, other]
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
  stage-build-after-host-one-more:
    workflow: stage-build
    resource: stage-build
    capacity: 5
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: one-more-round
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      returned: { result: /returned }
      answers: { item: answers }
      next: host
  landgate-after-host-as-is:
    workflow: landgate
    resource: landgate
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: take-as-is
      checkout: asking-run
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
      change: { result: /change }
      delivered: { result: "" }
  plan-after-stage-host-replan:
    workflow: plan
    resource: plan
    capacity: 3
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: replan
    inputs:
      item: { input: item }
      land_on: { input: land_on }
      answers: { item: answers }
  # An operator's `drop` or `reshape` on any stage's ask starts the close step on the item.
  close-after-build-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-build
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-check-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-check
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-host-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: stage-host
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-landgate-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: landgate
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }
  close-after-land-answers:
    workflow: close
    resource: close
    capacity: 2
    overlap: queue
    asks_settled:
      workflow: land
      settled: answered
      option: [drop, reshape]
    inputs:
      change: { result: /change }
      answers: { answers: true }

  # The attend stage, since 2026-11-25: when a stage's run ends with asks, an agent records
  # the answer it would give to each, as advice for whoever answers. It answers nothing and starts nothing. Each binding
  # names the endings of its stage that carry asks; a split that ends `waiting` and a plan
  # that ends `stop` carry none and are left out. The stage observes its item, so its runs
  # never stop, end or move it. `overlap: skip`: a second ask on an item while its first
  # attend run is still running is a missed measurement and nothing more. The land gate's and the land
  # stage's asks are left out: they are always the operator's, so a run would only say so.
  attend-after-plan:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: plan
      outcome: ask
    inputs:
      stage: plan
      asks: { result: /asks }
  attend-after-link:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: link
      outcome: [waiting, fold]
    inputs:
      stage: link
      asks: { result: /asks }
  attend-after-split:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: split
      outcome: [whole, split]
    inputs:
      stage: split
      asks: { result: /asks }
  attend-after-stage-build:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: stage-build
      outcome: ask
    inputs:
      stage: stage-build
      asks: { result: /asks }
  attend-after-stage-check:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: stage-check
      outcome: ask
    inputs:
      stage: stage-check
      asks: { result: /asks }
  attend-after-stage-host:
    workflow: attend
    resource: attend
    capacity: 2
    overlap: skip
    run_ended:
      workflow: stage-host
      outcome: ask
    inputs:
      stage: stage-host
      asks: { result: /asks }

  # The complexity shadow, since 2026-11-25: how complex an item is to get right, judged at
  # triage. It starts nothing and changes nothing. (A second judgment after each build was
  # dropped the same day: it said `involved` for nearly every change and told nothing.)
  # It runs as its own workflow so a failure in it can never fail the stage it watches. The
  # endings it starts on always start another stage too, so starting it never hides an item
  # that stopped. `overlap: skip`: a skipped start is a missed measurement and nothing more.
  complexity-after-triage:
    workflow: complexity
    resource: complexity
    capacity: 2
    overlap: skip
    run_ended:
      workflow: triage
      outcome: [build, narrow]
    inputs:
      item: { input: item }
