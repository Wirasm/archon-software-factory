# The factory's settings. A project sets them in
# `.archon/packs/Wirasm.archon-software-factory.yaml`, under `settings:`.
inputs:
  triage_policy:
    default: ""
    description: >-
      Path to the project's own triage policy, a document that says what its
      maintainers judge work items against. Relative to the project, or absolute.
      Empty means the project has none and the pack's default applies alone.
  plan_policy:
    default: ""
    description: >-
      Path to the project's own plan policy, a document that says what its
      maintainers hold a design to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  build_policy:
    default: ""
    description: >-
      Path to the project's own build policy, a document that says what its
      maintainers hold the code of a change to. Relative to the project, or absolute. Empty
      means the project has none and the pack's default applies alone.
  review_policy:
    default: ""
    description: >-
      Path to the project's own review policy, a document that says what its
      maintainers hold a change to before it lands. Relative to the project, or
      absolute. Empty means the project has none and the pack's default applies alone.
