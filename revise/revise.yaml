name: revise
description: |
  Bring the title and description of a proposed change up to date with what
  the checks found. Reads no code, changes nothing in the change.

model: ['@reviser', small]

inputs:
  item:
    description: The work item as text.
  proposal:
    description: The title and description the builder proposed the change with.
  verdict:
    description: The checks' reports put together, as the verdict stage's result.

returns: revise

nodes:
  - id: revise
    command: revise
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, description: 'One sentence about what is now true.' }
        description: { type: string, description: 'The description, as text ready to post.' }
        ready: { type: boolean, description: 'True when the checks approve and the change can be marked ready for a maintainer.' }
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
        for_next: { type: string, description: 'Anything the maintainer reading this change needs from you that has no field here. Write it to them.' }
      required: [title, description, ready, notes, for_next]
