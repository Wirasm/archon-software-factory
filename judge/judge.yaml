name: judge
description: |
  Decide what should happen to one work item, the way its maintainers would:
  the options that realistically apply, a recommendation and why. Reads the
  project, changes nothing.

model: ['@judge', medium]

inputs:
  item:
    description: >-
      The work item as text: its title, its body, and the discussion on it.
  triage_policy:
    default: ""
    description: The pack setting of the same name, declared here so a workflow that includes this stage can pass it through.
  members:
    default: "[]"
    description: The other members of the work order or split this item is part of, as JSON, each with its `key` and `title`. Empty when it is part of none.

returns: judge

nodes:
  - id: judge
    command: judge
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        recommend:
          type: string
          enum: &verbs [build, narrow, split, shape, recipe, native, fold, park, deprecate, decline, close]
          description: 'The option you recommend. It is one of the options below.'
        why: { type: string, description: 'One line: why this one.' }
        options:
          type: array
          description: 'The two or three that realistically apply, the recommended one among them.'
          items:
            type: object
            additionalProperties: false
            properties:
              verb: { type: string, enum: *verbs }
              does: { type: string, description: 'What happens to the item under this option.' }
              cost: { type: string, description: 'What choosing it costs.' }
            required: [verb, does, cost]
        summary: { type: string, description: 'For a maintainer who has not read the item.' }
        size:
          type: string
          enum: [xs, s, m, l, xl, none]
          description: 'For build or narrow: how far the smallest change that meets it reaches. xs: one place, a function or a file and its test. s: one part, a few files in one component. m: several parts of one area that have to change together. l: crosses areas, or changes something others depend on, such as a stored format, a public shape or a contract. xl: a new part of the system. Otherwise none.'
        cites:
          type: array
          items: { type: string }
          description: 'What the result rests on: files, docs, commits, other items.'
        notes: { type: string, description: 'Anything worth saying that has no field here: caveats, doubts, things noticed.' }
        open_questions:
          type: array
          items: { type: string }
          description: 'For shape: what a maintainer has to decide before this can be planned, the questions that decide the most first. Otherwise empty.'
        for_next: { type: string, description: 'Anything the engineer who plans this item needs from you that has no field here. Write it to them.' }
      required: [recommend, why, options, summary, size, cites, notes, open_questions, for_next]
