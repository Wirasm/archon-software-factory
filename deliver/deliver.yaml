name: deliver
description: |
  Take one planned item to a change that is ready for a maintainer: build it,
  check it, and send what the checks return back to the same builder until
  they approve or the rounds run out. One run, so the builder keeps its context.

inputs:
  item:
    description: The work item as text.
  plan:
    result_of: plan
    description: What plan concluded, as its result. Read from the item when the start does not pass it.
  before:
    result_of: deliver
    description: What the last delivery run on this item ended with, when there was one. Read from the item.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.

# The engine defines the `asks` property of the result and opens what a completed run leaves
# there on the item, so `result` does not declare it in its output format.
returns: { node: result, outcome: outcome, asks: asks }

nodes:
  - id: build
    include: build
    with:
      item: $INPUTS.item
      plan: $INPUTS.plan
      answers: $INPUTS.answers
      before: $INPUTS.before
      land_on: $INPUTS.land_on
      build_policy: $INPUTS.build_policy

  # One round: the builder fixes what the last round returned (never on the first
  # round), then the three checks look again side by side, each with a fresh context and told
  # what was returned last round and what the builder says it did about it.
  # A builder that ended in an ask or a stop made nothing to check: the rounds do not run
  # and `result` ends the run with what the builder said.
  - id: rounds
    depends_on: [build]
    when: "$build.output.outcome == 'built'"
    loop_group:
      max_iterations: 3
      # Running out of rounds is a normal ending: the last round's outcome stands and the
      # result node reports it as returned.
      on_exhausted: complete
      fresh_context: true
      until_bash: outcome=$verdict.output.outcome; test "$outcome" != return
      nodes:
        - id: fix
          command: fix
          model: ['@builder', large]
          context: { resume: build }
          when: "$LOOP_PREV.verdict.output.outcome == 'return'"
          output_format:
            type: object
            additionalProperties: false
            properties:
              outcome: { type: string, enum: [fixed, ask, stop] }
              summary: { type: string, description: 'What you fixed, one line per finding.' }
              disputed:
                type: array
                items: { type: string }
                description: 'Each finding you did not fix because you think it is wrong, with what you ran.'
              commit: { type: string, description: 'The commit that holds the fix. Empty when there is none.' }
              for_next: { type: string, description: 'Anything the engineer who checks this again needs from you that has no field here. Write it to them.' }
            required: [outcome, summary, disputed, commit, for_next]

        # The commit this change sits on, read after the builder's last commit: a builder
        # may move its branch onto newer work, and the checks must compare against that.
        - id: base
          depends_on: [fix]
          trigger_rule: all_done
          bash: |
            onto="${INPUTS_LAND_ON:-}"
            [ -n "$onto" ] || onto=$BASE_BRANCH
            git merge-base HEAD "origin/$onto" 2>/dev/null || git merge-base HEAD "$onto"

        # Shadow, since 2026-11-18: the checks the project declares, each run to its end by a
        # script on this round's commit, beside the three reviews. Nothing reads the result
        # yet: it is compared with what the reviews returned before it gates anything. It
        # never fails the round, and it runs no `fix` command.
        - id: checks
          depends_on: [base]
          runtime: bun
          with:
            file: $INPUTS.checks_file
            change: $build.output.proposed
          script: |
            import { existsSync, readFileSync } from 'node:fs';
            import { input } from 'archon:script';
            const results: { name: string; passed: boolean; exit: number | null; seconds: number; tail: string }[] = [];
            let problem = '';
            try {
              const file = input('file').trim();
              if (file && existsSync(file)) {
                const declared = (Bun.YAML.parse(readFileSync(file, 'utf8')) as any)?.checks ?? [];
                for (const check of declared) {
                  const started = Date.now();
                  const ran = Bun.spawnSync(['sh', '-c', String(check.run)], { stdout: 'pipe', stderr: 'pipe', timeout: 15 * 60 * 1000 });
                  const text = `${ran.stdout?.toString() ?? ''}\n${ran.stderr?.toString() ?? ''}`.trim();
                  results.push({
                    name: String(check.name),
                    passed: ran.exitCode === 0,
                    exit: ran.exitCode,
                    seconds: Math.round((Date.now() - started) / 1000),
                    tail: ran.exitCode === 0 ? '' : text.slice(-1500),
                  });
                }
              } else if (file) problem = `no checks file at ${file}`;
            } catch (error) {
              problem = error instanceof Error ? error.message : String(error);
            }
            const failed = results.filter(r => !r.passed).map(r => r.name);
            console.log(JSON.stringify({
              declared: results.length,
              failed,
              results,
              problem,
              metrics: results.length
                ? [{ name: 'sf.checks_failed', unit: 'checks', subject: (input('change').trim() || null), kind: 'count', value: failed.length }]
                : [],
            }));

        - id: review
          include: review
          depends_on: [base]
          with:
            item: $INPUTS.item
            answers: $INPUTS.answers
            base: $base.output
            review_policy: $INPUTS.review_policy
            returned_before: $LOOP_PREV.verdict.output
            builder_reply: $fix.output

        - id: tests
          include: tests
          depends_on: [base]
          with:
            item: $INPUTS.item
            answers: $INPUTS.answers
            base: $base.output
            test_policy: $INPUTS.test_policy
            returned_before: $LOOP_PREV.verdict.output
            builder_reply: $fix.output

        - id: product
          include: product
          depends_on: [base]
          with:
            item: $INPUTS.item
            answers: $INPUTS.answers
            base: $base.output
            product_policy: $INPUTS.product_policy

        - id: verdict
          include: verdict
          depends_on: [review, tests, product]
          with:
            item: $INPUTS.item
            answers: $INPUTS.answers
            review_policy: $INPUTS.review_policy
            reports: |
              ## From the review (is the change right against the item)
              $review.output

              ## From the test check (do the tests the change adds or edits earn their place)
              $tests.output

              ## From the product review (is the change right for the product's users)
              $product.output

              ## From the builder (what it did about what was returned last round; empty in the first round)
              $fix.output

        # Shows this round's review where the change is proposed, findings and notes on
        # their lines. Presentation only: the verdict is the run's, nothing reads the
        # posted review, and a post that fails is said on stderr and changes nothing.
        # It hands the verdict on unchanged, so the group still ends with it.
        # `shown` is the one node the round ends on: the loop's output is the output of its last
        # node, and the nodes after the loop read the verdict from it. So it waits for the
        # shadow checks too, whatever became of them.
        - id: shown
          depends_on: [verdict, checks]
          trigger_rule: all_done
          runtime: bun
          with:
            verdict: $verdict.output
            review: $review.output
            fix: $fix.output
            change: $build.output.proposed
            earlier: $LOOP_PREV.shown.output
          script: |
            import { execFileSync } from 'node:child_process';
            import { emit, forge, input, runId } from 'archon:script';
            const parse = (name: string) => { try { return JSON.parse(input(name) || 'null'); } catch { return null; } };
            const verdict = JSON.parse(input('verdict'));
            const review = parse('review');
            const fix = parse('fix');
            const earlier = parse('earlier') ?? {};
            const findings = verdict.findings ?? [];
            const notes = verdict.notes ?? [];
            const round = (earlier.round ?? 0) + 1;
            const found = (earlier.found ?? 0) + findings.length;
            const noted = (earlier.noted ?? 0) + notes.length;

            // The report: one comment where the change is proposed, replaced after every round.
            const cell = (text: unknown) => String(text ?? '').replace(/\r?\n+/g, ' ').replace(/\|/g, '\\|').trim();
            const short = (text: unknown, max = 140) => { const s = cell(text); return s.length > max ? `${s.slice(0, max - 1)}…` : s; };
            const claim = (text: unknown) => short(text, 90).replace(/[.:]$/, '');
            const table = (head: string[], rows: string[][]) =>
              [`| ${head.join(' | ')} |`, `| ${head.map(() => '---').join(' | ')} |`, ...rows.map(r => `| ${r.join(' | ')} |`)].join('\n');
            const fold = (title: string, body: string) => `<details>\n<summary>${title}</summary>\n\n${body}\n\n</details>`;
            const results: Record<string, string> = {
              approve: 'approve',
              return: `changes needed (${findings.length})`,
              replan: 'needs a different approach',
              ask: 'a decision is needed',
            };
            const did = round === 1
              ? 'First build.'
              : fix
                ? `${short(fix.summary, 200)}${(fix.disputed ?? []).length ? ` Disputed: ${(fix.disputed ?? []).length}.` : ''}`
                : 'Nothing was returned.';
            const history = [...(earlier.history ?? []), {
              round, result: results[verdict.outcome] ?? verdict.outcome, found: findings.length, notes: notes.length, did,
              items: findings.map((f: any) => `\`${cell(f.where)}\` ${short(f.what, 200)}`),
            }];
            const MARKER = '<!-- software-factory:report -->';
            const ENDING = '<!-- ending -->';
            const parts: string[] = [];
            parts.push(`## Factory report: round ${round}, ${results[verdict.outcome] ?? verdict.outcome}`);
            parts.push(ENDING);
            parts.push(String(verdict.summary ?? '').trim());
            parts.push('### Rounds');
            parts.push(table(['Round', 'Result', 'To change', 'Notes', 'What the builder did before this round'],
              history.map((h: any) => [String(h.round), h.result, String(h.found), String(h.notes), h.did])));
            const foundBefore = history.filter((h: any) => h.round < round && (h.items ?? []).length);
            if (foundBefore.length) {
              parts.push(fold('What earlier rounds returned', foundBefore
                .map((h: any) => `**Round ${h.round}**\n\n${h.items.map((x: string) => `- ${x}`).join('\n')}`).join('\n\n')));
            }
            if (findings.length) {
              parts.push('### Still to change');
              parts.push(table(['#', 'Where', 'What', 'Cost to leave'], findings.map((f: any, i: number) => [
                String(i + 1), `\`${cell(f.where)}\``, short(f.what, 220), short(f.cost_to_leave, 160),
              ])));
              parts.push(fold('Evidence for each', findings.map((f: any, i: number) => `**${i + 1}.** ${String(f.evidence ?? '').trim()}`).join('\n\n')));
            }
            const lines = review?.item_lines ?? [];
            if (lines.length) {
              const said: Record<string, string> = { met: 'met', not_met: 'not met', not_checked: 'not checked' };
              const how: Record<string, string> = { ran: 'ran it', read: 'read the code', none: 'not checked' };
              parts.push('### What the item asks for');
              parts.push(table(['Asked', 'Result', 'Checked by'], lines.map((l: any) => [
                claim(l.line), said[l.verdict] ?? cell(l.verdict), how[l.evidence] ?? cell(l.evidence),
              ])));
              parts.push(fold('How each was checked', lines.map((l: any) => `- **${claim(l.line)}**: ${String(l.how ?? '').trim()}`).join('\n')));
            }
            if (notes.length) {
              parts.push('### Notes (these do not hold the change)');
              parts.push(table(['Where', 'Note'], notes.map((n: any) => [`\`${cell(n.where)}\``, short(n.what, 240)])));
            }
            parts.push('<sub>Written by the software factory after each review round: a code review, a test check and a product review of the change, then one sorting of what they found. Findings are also on their lines below.</sub>');
            const report = `${MARKER}\n${parts.join('\n\n')}`;

            try {
              const change = input('change').trim();
              const where = change ? forge('resolve', { remote: change, web: true }) : null;
              if (where && where.kind === 'resolved' && where.subject?.kind === 'pr') {
                const ref = { repo: where.repo, number: where.subject.number };
                forge('workitem.comment.upsert', { subject: { kind: 'pr', ref }, marker: MARKER, body: report });
                // Findings and notes go on their lines, as one review a round.
                const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
                const by = (f: any) => `Reported by: ${(f.reported_by ?? []).join(', ')}`;
                const all = [
                  ...findings.map((f: any) => ({ f, body: `**Must change.** ${f.what}\n\n${f.evidence}\n\nCost to leave: ${f.cost_to_leave}\n\n${by(f)}` })),
                  ...notes.map((f: any) => ({ f, body: `**Note, does not hold the change.** ${f.what}\n\n${f.evidence}\n\n${f.why_a_note}\n\n${by(f)}` })),
                ];
                const onLine = all.filter(({ f }) => f.path && Number.isInteger(f.line) && f.line > 0);
                if (onLine.length) {
                  forge('pr.review.submit', {
                    ref,
                    commit,
                    key: `${runId()}:${commit}`,
                    summary: `Factory review, round ${round}: ${findings.length} to change, ${notes.length} notes. The factory report on this pull request has the whole picture.`,
                    comments: onLine.map(({ f, body }) => ({ path: f.path, line: f.line, body })),
                  });
                }
                console.error(`shown: report updated on ${change} (round ${round}), ${onLine.length} on their lines`);
              } else {
                console.error('shown: the change is proposed nowhere a report can be posted; nothing posted.');
              }
            } catch (error) {
              console.error(`shown: the report was not posted: ${error instanceof Error ? error.message : String(error)}`);
            }

            // Records for `archon metrics`. The latest record per change wins, so each round
            // carries the running totals: after the last round they are the change's totals.
            // The verdict goes on unchanged beside them.
            const subject = (input('change').trim() || null);
            const count = (name: string, unit: string, value: number) => ({ name, unit, subject, kind: 'count', value });
            emit({
              ...verdict,
              round,
              found,
              noted,
              history,
              report,
              metrics: [
                count('sf.review_rounds', 'rounds', round),
                count('sf.findings', 'findings', found),
                count('sf.notes', 'notes', noted),
              ],
            });
          output_format: { type: object }

  # The rounds ran out with the checks still returning the change. One more round is not
  # automatic: an agent reads what is left and leaves the decision as an ask, with its
  # recommendation, so the item's ending reaches an operator instead of telling nobody.
  - id: exhausted
    depends_on: [rounds]
    when: "$rounds.output.outcome == 'return'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  # What the place the change is proposed says about it: the project's own checks and any
  # review left there. Runs only on a change our checks approved. A finding goes to the same
  # builder, which pushes its fix, and the host is read again.
  - id: hostrounds
    depends_on: [rounds]
    when: "$rounds.output.outcome == 'approve'"
    loop_group:
      max_iterations: 3
      on_exhausted: complete
      fresh_context: true
      until_bash: outcome=$host.output.outcome; test "$outcome" != return
      nodes:
        - id: hostfix
          command: fix-host
          model: ['@builder', large]
          context: { resume: build }
          when: "$LOOP_PREV.host.output.outcome == 'return'"
          output_format:
            type: object
            additionalProperties: false
            properties:
              outcome: { type: string, enum: [fixed, ask, stop] }
              summary: { type: string, description: 'What you fixed, one line per finding.' }
              disputed:
                type: array
                items: { type: string }
                description: 'Each finding you did not fix because you think it is wrong, with what you ran.'
              commit: { type: string, description: 'The commit that holds the fix. Empty when there is none.' }
              for_next: { type: string, description: 'Anything the engineer who checks this again needs from you that has no field here. Write it to them.' }
            required: [outcome, summary, disputed, commit, for_next]

        - id: host
          include: host
          depends_on: [hostfix]
          trigger_rule: all_done
          with:
            item: $INPUTS.item
            answers: $INPUTS.answers
            change: $build.output.proposed
            host_policy: $INPUTS.host_policy
            returned_before: $LOOP_PREV.host.output
            builder_reply: $hostfix.output

  # What deliver ended with, as one outcome an operator or a later stage reads:
  # ready (our checks approved and the host is clear), returned (the rounds ran out with
  # findings open), waiting (the host has not answered yet), replan, or ask.
  # It computes that from what the two loops ended with and judges nothing.
  - id: result
    depends_on: [rounds, hostrounds, exhausted]
    trigger_rule: all_done
    runtime: bun
    with:
      built: $build.output
      checks: { from: $rounds.output, if_skipped: "" }
      host: { from: $hostrounds.output, if_skipped: "" }
      exhausted: { from: $exhausted.output, if_skipped: "" }
      change: $build.output.proposed
    script: |
      const read = (text: string | undefined) => (text ? JSON.parse(text) : null);
      const built = read(process.env.INPUTS_BUILT);
      const checks = read(process.env.INPUTS_CHECKS);
      const host = read(process.env.INPUTS_HOST);
      // No checks ran: the builder ended in an ask or a stop, and its own words are the ending.
      const last = host ?? checks ?? { summary: built?.stop || built?.summary, for_next: built?.for_next, asks: built?.asks };
      const hostOutcome: Record<string, string> = { clear: 'ready', none: 'ready', return: 'returned' };
      const outcome = host
        ? (hostOutcome[host.outcome] ?? host.outcome)
        : !checks ? (built?.outcome === 'ask' ? 'ask' : 'replan')
        : checks.outcome === 'return' ? 'returned' : checks.outcome;
      // The engine refuses a run whose asks do not hold together, and that would lose the
      // run at its last step. So an option id is made the token the engine wants, and a
      // recommendation that names no option falls back to the first one, saying so.
      const token = (id: unknown) =>
        String(id ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'option';
      // Rounds used up: the ask is the one the `exhausted` node left.
      const exhausted = read(process.env.INPUTS_EXHAUSTED);
      const left = outcome === 'returned' && !host && exhausted ? (exhausted.asks ?? []) : (last.asks ?? []);
      const asks = left.map((ask: any) => {
        const options = (ask.options ?? []).map((o: any) => ({ id: token(o.id), does: String(o.does ?? ''), cost: String(o.cost ?? '') }));
        // The engine wants at least two options; a stage that left one gets "hold" beside it.
        if (options.length < 2) options.push({ id: 'hold', does: 'Hold the item until an operator says what to do.', cost: 'The item waits.' });
        const wanted = token(ask.recommendation?.option);
        const named = options.some((o: { id: string }) => o.id === wanted);
        const why = String(ask.recommendation?.why ?? '');
        return {
          question: String(ask.question ?? ''),
          context: ask.from ? `${ask.context ?? ''} (Left by: ${ask.from}.)` : String(ask.context ?? ''),
          options,
          recommendation: named
            ? { option: wanted, why }
            : { option: options[0]?.id ?? 'option', why: `The stage's recommendation named no option ("${ask.recommendation?.option ?? ''}"). ${why}` },
          artifacts: [],
        };
      });
      // An ending that is not ready stops the item, so it always tells an operator: when the
      // stage that ended it attached no question, the run leaves one saying what it knows.
      if (outcome !== 'ready' && outcome !== 'waiting' && asks.length === 0) {
        const said: Record<string, string> = {
          ask: 'A stage asked for a decision and attached no question.',
          returned: 'The checks returned the change and the rounds are used up.',
          replan: checks ? 'A check says the change needs a different approach.' : 'The builder stopped: the plan could not be built as written.',
        };
        asks.push({
          question: 'Delivery of this item stopped. What should happen to the change now?',
          context: [said[outcome] ?? `Delivery ended as ${outcome}.`, String(last.summary ?? ''), String(last.for_next ?? '')]
            .filter(Boolean).join(' '),
          options: [
            { id: 'send-back-once', does: 'The same builder continues on the change with what you say in your answer.', cost: 'One more delivery run.' },
            { id: 'replan', does: 'The item goes back to planning with what you say in your answer.', cost: 'The work so far may be discarded.' },
            { id: 'hold', does: 'Nothing proceeds until an operator says more.', cost: 'The item waits.' },
          ],
          recommendation: { option: 'hold', why: 'No stage recommended a way forward, so the run does not guess one.' },
          artifacts: [],
        });
      }
      console.log(JSON.stringify({
        outcome,
        ended_at: host ? 'host' : checks ? 'checks' : 'build',
        change: process.env.INPUTS_CHANGE ?? '',
        summary: last.summary ?? '',
        asks,
        for_next: last.for_next ?? '',
        noticed: checks?.noticed ?? [],
        // Records for `archon metrics`: the change (latest record per change wins), how this
        // run ended for it, and one count per delivery run whatever the change.
        metrics: [
          { name: 'sf.changes', unit: 'changes', subject: (process.env.INPUTS_CHANGE || null), kind: 'count', value: 1 },
          { name: `sf.ended_${outcome}`, unit: 'runs', subject: (process.env.INPUTS_CHANGE || null), kind: 'count', value: 1 },
          { name: 'sf.delivery_runs', unit: 'runs', subject: null, kind: 'count', value: 1 },
        ],
      }));
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [ready, returned, waiting, replan, ask] }
        ended_at: { type: string, enum: [build, checks, host] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause. A discoveries stage can start from it.' }
      required: [outcome, ended_at, change, summary, for_next, noticed]

  # The report says how the run ended: the same comment, with the ending and what the
  # project's own checks and reviews said written in. Presentation only.
  - id: reported
    depends_on: [result]
    trigger_rule: all_done
    runtime: bun
    with:
      result: $result.output
      checks: { from: $rounds.output, if_skipped: "" }
      host: { from: $hostrounds.output, if_skipped: "" }
      change: $build.output.proposed
    script: |
      import { forge, input } from 'archon:script';
      const parse = (name: string) => { try { return JSON.parse(input(name) || 'null'); } catch { return null; } };
      const result = parse('result');
      const checks = parse('checks');
      const host = parse('host');
      const MARKER = '<!-- software-factory:report -->';
      const ENDING = '<!-- ending -->';
      try {
        const change = input('change').trim();
        const where = change ? forge('resolve', { remote: change, web: true }) : null;
        if (result && checks?.report && where && where.kind === 'resolved' && where.subject?.kind === 'pr') {
          const cell = (text: unknown) => String(text ?? '').replace(/\r?\n+/g, ' ').replace(/\|/g, '\\|').trim();
          const ended: Record<string, string> = {
            ready: 'ready for a maintainer',
            returned: 'returned: the rounds ran out with findings open',
            waiting: 'waiting for the project\'s own checks',
            replan: 'needs a different approach',
            ask: 'a decision is needed',
          };
          const hostSaid: Record<string, string> = { clear: 'clear', none: 'nothing to read', return: 'findings open', ask: 'a decision is needed' };
          const asks = (result.asks ?? []).map((a: any) => `- ${cell(a.question)}`).join('\n');
          const ending = [
            '| Ended | Review rounds | The project\'s own checks and reviews |',
            '| --- | --- | --- |',
            `| ${ended[result.outcome] ?? cell(result.outcome)} | ${checks.round ?? ''} | ${host ? (hostSaid[host.outcome] ?? cell(host.outcome)) : 'not read'} |`,
            host?.summary ? `\n${String(host.summary).trim()}` : '',
            asks ? `\n**Waiting on a decision:**\n${asks}` : '',
          ].filter(Boolean).join('\n');
          const body = String(checks.report)
            .replace(/^## Factory report: .*$/m, `## Factory report: ${ended[result.outcome] ?? result.outcome}`)
            .replace(ENDING, ending);
          forge('workitem.comment.upsert', {
            subject: { kind: 'pr', ref: { repo: where.repo, number: where.subject.number } },
            marker: MARKER,
            body,
          });
          console.error(`reported: report closed on ${change} as ${result.outcome}`);
        } else {
          console.error('reported: nothing to update.');
        }
      } catch (error) {
        console.error(`reported: the report was not updated: ${error instanceof Error ? error.message : String(error)}`);
      }
      console.log('done');
