name: docs
description: |
  Make the project's documentation true for one built change, as a commit on
  the change's own branch. Changes documentation only. Pushes nothing.

model: ['@docs', medium]

inputs:
  item:
    description: The work item as text.
  base:
    description: The commit the change was built on.

returns: docs

nodes:
  - id: docs
    command: docs
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [in_line, ask] }
        summary: { type: string, description: 'For a maintainer: what the docs now say that they did not.' }
        changed:
          type: array
          items: { type: string }
          description: 'Each place changed, and what changed there. Empty when nothing needed changing.'
        commit: { type: string, description: 'The commit that holds the documentation change. Empty when there is none.' }
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommend: { type: string }
              why: { type: string }
            required: [question, context, options, recommend, why]
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
      required: [outcome, summary, changed, commit, asks, notes]
